name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

  workflow_dispatch: # Allows the workflow to be triggered manually

permissions:
  contents: read

env:
  HEROKU_NODE_VERSION: 22 # Chosen to match what is used internally by the Heroku CLI

jobs:
  actions-lockfile-verification:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  code-format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.HEROKU_NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prettier
        run: npx prettier . --check

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.HEROKU_NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint

  unit-test:
    runs-on: ubuntu-latest

    env:
      COLUMNS: 160

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
